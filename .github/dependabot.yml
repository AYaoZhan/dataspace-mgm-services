# Dependabot (TRG 2.06): weekly updates of the GitHub Actions, the base image and the Python dependencies.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependabot"
      - "github-actions"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    labels:
      - "dependabot"
      - "docker"
    schedule:
      interval: "weekly"

  # Python dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    labels:
      - "dependabot"
      - "python"
    schedule:
      interval: "weekly"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
