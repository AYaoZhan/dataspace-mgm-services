{{- if and .Values.backend.enabled .Values.backend.ingress.enabled }}
{{- $fullName := include "dataspace-mgm.backend.fullname" . }}
{{- $port := .Values.backend.service.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "dataspace-mgm.labels" . | nindent 4 }}
    {{- include "dataspace-mgm.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  {{- with .Values.backend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.backend.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.backend.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.backend.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}
