{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dataspace-mgm.backend.fullname" . }}-test"
  labels:
    {{- include "dataspace-mgm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-backend
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 32Mi
      command: ["/bin/sh", "-c"]
      args:
        - >-
          curl --silent --show-error --fail --retry 10 --retry-delay 5 --retry-all-errors
          http://{{ include "dataspace-mgm.backend.fullname" . }}:{{ .Values.backend.service.port }}/health
          | grep -q "\"status\":\"UP\""
{{- end }}
